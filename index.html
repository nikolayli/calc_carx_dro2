<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
    </head>

    <div class="inputs">
        <h3>Параметры автомобиля:</h3>
        <p>
            <label
                >Maccа автомобиля:
                <input type="number" id="weight" value="1500"
            /></label>
        </p>
        <p>
            <label
                >Развесовка: <input type="number" id="bias" value="51"
            /></label>
        </p>
        <p>
            <label
                >Мощность: <input type="number" id="power" value="300"
            /></label>
        </p>
        <p>
            <label
                >Ширина покрышек: <input type="number" id="width" value="265"
            /></label>
        </p>
        <p>
            <label
                >Профиль шин: <input type="number" id="profile" value="35"
            /></label>
        </p>
        <p>
            <label
                >Диаметр дисков: <input type="number" id="diameter" value="18"
            /></label>
        </p>

        <button id="calcBtn">Рассчитать</button>
    </div>

    <div class="result">
        <h3>Результаты расчета подвески:</h3>

        <p><strong>Передняя ось:</strong></p>
        <p>
            Жесткость пружины:
            <span id="frontSpring" class="val">--</span> кг/мм
        </p>

        <br />

        <p><strong>Задняя ось:</strong></p>
        <p>
            Жесткость пружины: <span id="rearSpring" class="val">--</span> кг/мм
        </p>
    </div>

    <script type="module">
        import init, {
            calculate_setup,
            CarInputs,
        } from "./pkg/calc_carx_dro2.js";

        async function run() {
            await init();

            document.getElementById("calcBtn").addEventListener("click", () => {
                const inputs = new CarInputs();
                inputs.total_weight = parseFloat(
                    document.getElementById("weight").value,
                );
                inputs.front_weight_pct = parseFloat(
                    document.getElementById("bias").value,
                );
                inputs.power_hp = parseFloat(
                    document.getElementById("power").value,
                );
                inputs.tyre_width = parseFloat(
                    document.getElementById("width").value,
                );
                inputs.tyre_profile = parseFloat(
                    document.getElementById("profile").value,
                );
                inputs.wheel_diameter = parseFloat(
                    document.getElementById("diameter").value,
                );

                const result = calculate_setup(inputs);

                document.getElementById("frontSpring").innerText =
                    result.front.spring_rate.toFixed(2);

                document.getElementById("rearSpring").innerText =
                    result.rear.spring_rate.toFixed(2);

                //inputs.free();
                //result.free();
            });
        }
        run();
    </script>
</html>
